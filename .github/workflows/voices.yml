name: Generate story voices

# Records every story line with Sarvam AI text-to-speech, commits the audio, then builds a new APK.
# Needs the repository secret SARVAM_API_KEY. Runs by hand, or when the story scripts or voice settings change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/stories/scenes.ts
      - tools/voice/**

permissions:
  contents: write
  actions: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the API key is set
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          if [ -z "$SARVAM_API_KEY" ]; then
            echo "::error::Add your Sarvam API key as the repository secret SARVAM_API_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Record story lines
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: node --experimental-strip-types tools/voice/generate.mts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Age each character's voice
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q praat-parselmouth
          python tools/voice/tune.py

      - name: Commit recordings
        id: commit
        run: |
          git add -A assets/voices src/stories/voices.ts tools/voice
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new recordings."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update story voice recordings"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build a new APK with the voices
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml --ref main
