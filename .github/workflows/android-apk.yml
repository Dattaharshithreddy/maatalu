name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk maatalu-${{ github.run_number }}.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: maatalu-apk
          path: maatalu-${{ github.run_number }}.apk

      - name: Publish as a GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Maatalu build ${{ github.run_number }}
          files: maatalu-${{ github.run_number }}.apk
          prerelease: true
