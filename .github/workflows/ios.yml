name: Build iOS app

# Without Apple secrets: builds for the iPhone Simulator, to prove the iOS app compiles.
# With these repository secrets it builds a signed app and uploads it to TestFlight:
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      App Store Connect API issuer ID
#   ASC_KEY_P8         contents of the downloaded AuthKey_XXXX.p8 file
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the newest Xcode 26 (Expo SDK 57 needs 26.4 or later)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26 found on this runner"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Set build number from run number
        run: node -e "const j=require('./app.json');j.expo.ios.buildNumber=String(${{ github.run_number }});require('fs').writeFileSync('app.json',JSON.stringify(j,null,2))"

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the iPhone Simulator (no Apple account needed)
        if: env.HAS_APPLE != 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace Maatalu.xcworkspace -scheme Maatalu -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 40
          cd build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/maatalu-simulator.zip" Maatalu.app
          echo "::notice::iOS app compiled. Add the Apple secrets listed at the top of ios.yml to get TestFlight builds."

      - name: Upload simulator build
        if: env.HAS_APPLE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maatalu-ios-simulator
          path: maatalu-simulator.zip

      - name: Write the App Store Connect key
        if: env.HAS_APPLE == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive a signed build
        if: env.HAS_APPLE == 'true'
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace Maatalu.xcworkspace -scheme Maatalu -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Maatalu.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive | tail -n 40

      - name: Upload to TestFlight
        if: env.HAS_APPLE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Maatalu.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 10-30 minutes)."
